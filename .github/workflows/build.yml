name: Build Android APK and Windows EXE

on:
  push:
    branches: [ china-life-local-clipboard ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run parser and pairing tests
        run: gradle :android:app:testDebugUnitTest
      - name: Build APK
        run: gradle :android:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guoshou-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Run unit tests
        working-directory: windows
        run: python -m unittest -v
      - name: Package EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GuoshouCodeClipboard --paths windows --collect-all qrcode --collect-all PIL windows/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: guoshou-windows-exe
          path: dist/GuoshouCodeClipboard.exe
          if-no-files-found: error
