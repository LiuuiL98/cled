name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Package EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name ChinaLifeEShopAssistant --collect-all playwright --collect-all PySide6 main.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/ChinaLifeEShopAssistant/ChinaLifeEShopAssistant.exe")) { throw "EXE was not generated" }
          Get-Item "dist/ChinaLifeEShopAssistant/ChinaLifeEShopAssistant.exe" | Format-List Name,Length

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: ChinaLifeEShopAssistant-Windows-x64
          path: dist/ChinaLifeEShopAssistant/
          if-no-files-found: error
          retention-days: 30
