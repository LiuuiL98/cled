plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liuuil.cled.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.liuuil.cled.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ZXing's CaptureManager calls ContextCompat at runtime.
    // Keep AndroidX Core explicit so the class is packaged in the APK.
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
